    <div x-show="modalExcluir" class="fixed inset-0 z-[110] flex items-center justify-center p-4" x-cloak>
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm" @click="modalExcluir = false" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"></div>

        <div class="relative w-full max-w-md bg-[#0f1115] border border-red-900/30 rounded-3xl p-8 shadow-2xl transition-all"
             x-show="modalExcluir" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 scale-95 translate-y-8" x-transition:enter-end="opacity-100 scale-100 translate-y-0">
            
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-red-900/20 mb-6">
                    <span class="material-symbols-outlined text-red-500 text-4xl">warning</span>
                </div>
                <h3 class="text-2xl font-bold text-white mb-2">Confirmar Exclusão</h3>
                <p class="text-sm text-gray-400 mb-8 px-4">
                    Você tem certeza que deseja remover <span class="text-white font-black" x-text="nomeParaExcluir"></span>? Esta operação removerá o item permanentemente do sistema.
                </p>
            </div>

            <form method="POST" class="flex gap-4">
                {% csrf_token %}
                <input type="hidden" name="action" value="delete">
                <input type="hidden" name="sku_original" :value="skuOriginal">
                <input type="hidden" name="next_url" value="{{ query_string }}">
                
                <button type="button" @click="modalExcluir = false"
                        class="flex-1 px-4 py-3 rounded-2xl border border-gray-800 text-gray-400 font-bold hover:bg-gray-800 transition-all">
                    Manter
                </button>
                <button type="submit"
                        class="flex-1 px-4 py-3 rounded-2xl bg-red-600 text-white font-black hover:bg-red-700 shadow-lg shadow-red-600/20 transition-all active:scale-95">
                    Sim, Excluir
                </button>
            </form>
        </div>
    </div>
