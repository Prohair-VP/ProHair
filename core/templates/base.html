<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prohair - Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        /* Pequeno ajuste para garantir que o fundo escuro cubra a tela toda */
        body { background-color: #09090b; } /* Cor exata quase preta */
        /* Estilo Sênior para Barras de Rolagem */
        ::-webkit-scrollbar {
            width: 8px; /* Deixa a barra mais fina */
        }

        ::-webkit-scrollbar-track {
            background: #09090b; /* Fundo da trilha igual ao fundo do site */
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b; /* Cor do "pegador" da barra (slate-800) */
            border-radius: 10px;
            border: 2px solid #09090b; /* Cria um respiro ao redor do pegador */
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #0891b2; /* Muda para cyan-600 ao passar o mouse */
        }

        /* Tenta forçar o tema escuro no dropdown do select para alguns navegadores */
        select option {
            background-color: #0f1115;
            color: #d1d5db;
            padding: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #0891b2;
        }
    </style>
</head>
<body class="text-gray-300 font-sans antialiased min-h-screen flex flex-col">

    <nav class="bg-[#09090b] border-b border-gray-800">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <div class="bg-cyan-900/40 p-1.5 rounded-md">
                        <svg class="h-5 w-5 text-cyan-400" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    </div>
                    <span class="text-xl font-bold text-white tracking-wide">ProHair</span>
                </div>
                
                <div class="flex gap-8">
                    <a href="#" class="bg-[#003A4D] text-cyan-400 px-4 py-1.5 rounded-lg text-sm font-semibold flex items-center">
                        Produtos
                    </a>
                    <a href="#" class="text-gray-400 hover:text-white px-3 py-1.5 rounded-md text-sm font-medium flex items-center transition">
                        Relatórios
                    </a>
                    <a href="#" class="text-gray-400 hover:text-white px-3 py-1.5 rounded-md text-sm font-medium flex items-center transition">
                        Clientes
                    </a>
                    <a href="#" class="text-gray-400 hover:text-white px-3 py-1.5 rounded-md text-sm font-medium flex items-center transition">
                        Configurações
                    </a>
                </div>
                <div class="w-24"></div> 
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-[1400px] w-full mx-auto py-8 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
