<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prohair - Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        /* Pequeno ajuste para garantir que o fundo escuro cubra a tela toda */
        body { background-color: #09090b; } /* Cor exata quase preta */
        /* Estilo Sênior para Barras de Rolagem */
        ::-webkit-scrollbar {
            width: 8px; /* Deixa a barra mais fina */
        }

        ::-webkit-scrollbar-track {
            background: #09090b; /* Fundo da trilha igual ao fundo do site */
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b; /* Cor do "pegador" da barra (slate-800) */
            border-radius: 10px;
            border: 2px solid #09090b; /* Cria um respiro ao redor do pegador */
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #0891b2; /* Muda para cyan-600 ao passar o mouse */
        }

        /* Tenta forçar o tema escuro no dropdown do select para alguns navegadores */
        select option {
            background-color: #0f1115;
            color: #d1d5db;
            padding: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #0891b2;
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="text-gray-300 font-sans antialiased min-h-screen flex flex-col">

    <nav class="bg-[#09090b] border-b border-gray-800">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center h-16 gap-12">
                <div class="flex items-center gap-6">
                    <a href="{% url 'index' %}" class="{% if request.resolver_match.url_name == 'index' %}bg-[#003A4D] text-cyan-400{% else %}text-gray-400 hover:text-white{% endif %} px-4 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all outline-none">
                        <span class="material-symbols-outlined text-[18px]">dashboard</span>
                        <span>Dashboard</span>
                    </a>

                    <div class="relative" x-data="{ dropdownAberto: false }" @mouseenter="dropdownAberto = true" @mouseleave="dropdownAberto = false">
                        <button :class="dropdownAberto ? 'bg-[#003A4D] text-cyan-400' : 'text-gray-400 hover:text-white'"
                                class="px-4 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all outline-none">
                            <span>Produtos</span>
                            <span class="material-symbols-outlined text-sm transition-transform" :class="dropdownAberto ? 'rotate-180' : ''">expand_more</span>
                        </button>

                        <div x-show="dropdownAberto" 
                            x-cloak
                            x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 translate-y-1"
                            x-transition:enter-end="opacity-100 translate-y-0"
                            class="absolute top-full left-0 w-56 mt-1 bg-[#0f1115] border border-gray-800 rounded-xl shadow-2xl py-2 z-[200]">
                            
                            <p class="px-4 py-2 text-[10px] font-black text-gray-600 uppercase tracking-widest border-b border-gray-800/50 mb-1">Catálogo</p>
                            
                            <a href="{% url 'produtos' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300 hover:bg-cyan-600/10 hover:text-cyan-400 transition-colors">
                                <span class="material-symbols-outlined text-lg">inventory_2</span>
                                Ver Todos os Produtos
                            </a>

                            <div class="border-t border-gray-800/50 my-1"></div>
                            
                            <p class="px-4 py-2 text-[10px] font-black text-gray-600 uppercase tracking-widest mt-1">Marketplaces</p>
                            
                            <a href="{% url 'produtos' %}?mkt=mercado_livre" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300 hover:bg-cyan-600/10 hover:text-cyan-400 transition-colors">
                                <span class="material-symbols-outlined text-lg">storefront</span>
                                Mercado Livre
                            </a>
                            
                            <a href="{% url 'shopee' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300 hover:bg-orange-600/10 hover:text-orange-500 transition-colors">
                                <span class="material-symbols-outlined text-lg">shopping_bag</span>
                                Shopee ProHair
                            </a>
                        </div>
                    </div>
                    
                    <a href="#" class="text-gray-400 hover:text-white px-3 py-1.5 rounded-md text-sm font-medium flex items-center transition-all">
                        Relatórios
                    </a>
                    <a href="#" class="text-gray-400 hover:text-white px-3 py-1.5 rounded-md text-sm font-medium flex items-center transition-all">
                        Clientes
                    </a>
                    <a href="#" class="text-gray-400 hover:text-white px-3 py-1.5 rounded-md text-sm font-medium flex items-center transition-all">
                        Configurações
                    </a>
                </div>

                <!-- Botão de Sair (Logout) -->
                <div class="ml-auto flex items-center">
                    {% if user.is_authenticated %}
                        <form method="post" action="{% url 'logout' %}" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-gray-500 hover:text-red-400 px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-all">
                                <span class="material-symbols-outlined text-[18px]">logout</span>
                                Sair
                            </button>
                        </form>
                    {% endif %}
                </div>

            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-[1400px] w-full mx-auto py-8 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Manter a posição de scroll após o recarregamento (ex: ao salvar um formulário)
        document.addEventListener("DOMContentLoaded", function() {
            if (sessionStorage.getItem("scrollPosition") !== null) {
                window.scrollTo(0, parseInt(sessionStorage.getItem("scrollPosition")));
                sessionStorage.removeItem("scrollPosition"); // Limpa para evitar scroll indesejado em navegação normal
            }
        });

        window.addEventListener("beforeunload", function() {
            sessionStorage.setItem("scrollPosition", window.scrollY);
        });
    </script>
</body>
</html>
