<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ProHair Sistema</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#050505] min-h-screen flex items-center justify-center relative overflow-hidden text-gray-200">

    <!-- Background Effects -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-600/20 rounded-full blur-[120px] mix-blend-screen opacity-50"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] mix-blend-screen opacity-50"></div>
    </div>

    <div class="relative z-10 w-full max-w-md p-8 bg-[#0a0c10]/80 backdrop-blur-xl border border-gray-800/50 rounded-2xl shadow-2xl">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">ProHair</h1>
            <p class="text-sm text-gray-400">Sistema Interno de Gestão</p>
        </div>

        {% if form.errors %}
        <div class="mb-6 bg-red-500/10 border border-red-500/20 rounded-lg p-4">
            <p class="text-sm text-red-400 font-medium text-center">Usuário ou senha inválidos. Tente novamente.</p>
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-300 mb-2">Usuário</label>
                <input type="text" name="username" id="id_username" required autofocus
                    class="w-full bg-[#050505] border border-gray-800 text-gray-200 rounded-lg px-4 py-3 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all placeholder-gray-600"
                    placeholder="Digite seu usuário">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-300 mb-2">Senha</label>
                <input type="password" name="password" id="id_password" required
                    class="w-full bg-[#050505] border border-gray-800 text-gray-200 rounded-lg px-4 py-3 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all placeholder-gray-600"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-cyan-500/20 transition-all transform hover:scale-[1.02] active:scale-95">
                Entrar no Sistema
            </button>
        </form>

        <div class="mt-8 text-center border-t border-gray-800/50 pt-6">
            <p class="text-xs text-gray-500">Acesso restrito a colaboradores ProHair.</p>
        </div>
    </div>

</body>
</html>
